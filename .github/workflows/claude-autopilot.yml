name: Praxis Autopilot

# Autonomous engineering agent (SINGLE lane). One builder so it doesn't saturate the
# repo's Actions runners — when builders flood CI, GitHub starves the Coordinator's
# scheduled runs and nothing merges. Auth via the Max-plan OAuth token ($0). Driver:
# the Supabase dispatcher. NEVER pushes to production directly — opens PRs only.

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

on:
  schedule:
    - cron: "25 */6 * * *"   # backstop; the Supabase dispatcher drives this repo
  workflow_dispatch: {}

concurrency:
  group: praxis-autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 160 --permission-mode bypassPermissions"
          show_full_output: true
          prompt: |
            You are Praxis's autonomous engineering agent for conduit-nextjs. Founder (Luis)
            is away; you carry the build. Follow these rules EXACTLY.

            PRODUCT: conduit-nextjs is PRAXIS — an autonomous AI specialist team for businesses
            ("Nine specialists. Zero payroll."), conduitai.io. It is NOT a household-finance app.
            NEVER use household/cash-flow/budgeting/"fin_*" concepts on Praxis surfaces, and
            NEVER modify anything under src/**/finance/** (that's the separate Cadence product).

            1. SCOPE & DEDUP — Run `gh pr list --state open --limit 100` and
               `gh issue list --label claude-queue --state open --limit 100`. Pick exactly
               ONE issue — the top OPEN claude-queue issue that does NOT already have an open
               PR (skip in-flight work — that's the #1 cause of duplicate PRs). Post "🤖
               building now" on it to claim it, build it, open its PR, then STOP and exit
               successfully. Do NOT start a second issue. If none are unclaimed, exit immediately.

            1b. FINISH CLEANLY — Running until you hit the turn limit marks the whole run
                FAILED (and emails the founder). Scope your work so you finish ONE issue with
                budget to spare. If you're getting close to your turn budget, immediately
                commit what you have, open the PR (DRAFT if unfinished) with a note, and exit
                successfully — never run to the max-turns ceiling.

            2. PREMORTEM — Before coding, comment on the issue: "How could this break the live
               app, leak secrets, cost money, or weaken security?" If risky/ambiguous, ask and stop.

            3. SAFETY — New branch + PR. NEVER push to main. Don't touch auth, billing, RLS,
               secrets, or env config unless the issue explicitly says so (call it out loudly).
               Never touch src/**/finance/**. NEVER add a file under supabase/migrations/ —
               the pipeline can't apply migrations; if an issue needs a schema change, open a
               DRAFT PR describing the SQL and comment that it needs manual migration, don't
               write the migration file.

            4. VERIFY — `npm run build` and `npx tsc --noEmit` MUST pass before opening the PR.
               Production-level quality: match patterns, handle empty/loading/error states,
               responsive 375/768/1280. Can't get green in budget → open DRAFT + comment blocker.

            5. CONTEXT — Read CLAUDE.md, AGENTS.md, DESIGN.md, specs/. This is the founder's
               life's work, about to take paying customers — treat it with that care.

            6. HANDOFF — Open the PR yourself: `git push -u origin <branch>` then
               `gh pr create --base main --head <branch> --title "<concise>" --body "<summary + premortem + what to verify>"`.
               Link the issue, keep PRs small/single-purpose, comment the PR link on the issue.
