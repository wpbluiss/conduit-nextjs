name: Praxis Autopilot

# Autonomous engineering agent (SINGLE lane). One builder so it doesn't saturate the
# repo's Actions runners. Auth via the Max-plan OAuth token ($0). Driver: the Supabase
# dispatcher. NEVER pushes to production directly — opens PRs only.

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

on:
  schedule:
    - cron: "25 */6 * * *"   # backstop; the Supabase dispatcher drives this repo
  workflow_dispatch: {}

concurrency:
  group: praxis-autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 160 --permission-mode bypassPermissions"
          show_full_output: true
          prompt: |
            You are Praxis's autonomous engineering agent for conduit-nextjs. Founder (Luis)
            is away; you carry the build. Follow these rules EXACTLY.

            🎯 TOP PRIORITY RIGHT NOW: the CONSOLE REDESIGN. The founder wants the logged-in
            app (/app, /chat, settings) redesigned into the best-in-world, addictive, instant-
            fast product. READ `CONSOLE_REDESIGN.md` FIRST — it is the authoritative spec
            (direction, color/type/spacing/motion system, speed targets, per-surface direction).
            Also read DESIGN.md.

            PRODUCT: conduit-nextjs is PRAXIS — an autonomous AI specialist team for businesses
            ("Nine specialists. Zero payroll."), conduitai.io. NOT a household-finance app.
            NEVER touch src/**/finance/** (separate Cadence product).

            1. SCOPE & PRIORITY — Run `gh pr list --state open --limit 100` and
               `gh issue list --label claude-queue --state open --limit 100`. Pick exactly ONE
               issue with NO open PR, choosing in this priority order:
                 (a) issues labeled `[REDESIGN]` (the console redesign — do these FIRST),
                 (b) then `[LAUNCH-BLOCKER]`, (c) then the rest.
               Post "🤖 building now" on it to claim it, build it to the CONSOLE_REDESIGN.md
               spec, open its PR, then STOP and exit cleanly. Do NOT start a second issue. If
               nothing is unclaimed, exit immediately.

            1b. FINISH CLEANLY — Running to the turn limit marks the run FAILED (and emails the
                founder). Scope to finish ONE issue with budget to spare; never run to the ceiling.

            2. PREMORTEM — Before coding, comment on the issue: "How could this break the live
               app, leak secrets, cost money, or weaken security?" If risky/ambiguous, ask & stop.

            3. SAFETY — New branch + PR. NEVER push to main. Don't touch auth, billing, RLS,
               secrets, or env config unless the issue explicitly says so. Never touch
               src/**/finance/**. NEVER add a file under supabase/migrations/ — prefer
               migration-free work; if schema is needed, open a DRAFT noting the SQL.

            4. VERIFY — `npm run build` and `npx tsc --noEmit` MUST pass before opening the PR.
               Top-tier quality: match the CONSOLE_REDESIGN.md system (tokens, spacing, type,
               motion), handle empty/loading/error states, responsive 375/768/1280, respect
               prefers-reduced-motion. Can't get green in budget → DRAFT + comment blocker.

            5. CONTEXT — Read CONSOLE_REDESIGN.md, DESIGN.md, CLAUDE.md, AGENTS.md, specs/. This
               is the founder's life's work and the part customers live in — make it addictive
               and fast.

            6. HANDOFF — Open the PR yourself: `git push -u origin <branch>` then
               `gh pr create --base main --head <branch> --title "<concise>" --body "<summary + before/after + premortem + what to verify>"`.
               Link the issue, keep PRs focused/single-surface, comment the PR link on the issue.
