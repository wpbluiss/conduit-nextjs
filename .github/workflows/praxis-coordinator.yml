name: Praxis Coordinator

# Self-coordination on the Max plan ($0) — replaces the metered Supabase "merger"
# + "planner" edge functions. Runs Claude Code to keep the queue deep, review &
# merge safe open PRs, and close duplicates — so the company ships without API credits.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: praxis-coordinator
  cancel-in-progress: false

jobs:
  coordinate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 150 --permission-mode bypassPermissions"
          prompt: |
            You are Praxis's autonomous COORDINATOR for wpbluiss/conduit-nextjs.
            Founder (Luis) is away; keep the company shipping HARD by keeping the work
            queue deep, then reviewing and merging the safe open PRs. `gh` is installed
            and authenticated for this repo. Act only on wpbluiss/conduit-nextjs.

            STEP 1 — REFILL THE QUEUE FIRST (do this before merging, every run, so the
            builders never starve and go idle):
            - Count open issues labeled `claude-queue` that do NOT already have an open PR:
              `gh issue list --repo wpbluiss/conduit-nextjs --label claude-queue --state open --limit 100`
            - If there are FEWER THAN 15 such issues, file NEW high-value, single-session
              engineering tasks until there are ~20. Each must move the company goal:
              world-class UI + web launch, then conversion/revenue, then mobile. Read
              DESIGN.md / PRODUCT_PLAN.md / specs for direction. Each issue = a crisp brief
              (goal, concrete scope, acceptance criteria). Label them `claude-queue` (+ `[UI]`
              when UI). DO NOT duplicate an existing open issue OR anything that already has
              an open PR. NEVER queue `/finance` (Cadence) work — that workstream is off-limits.

            STEP 2 — MERGE & DEDUPE:
            - `gh pr list --repo wpbluiss/conduit-nextjs --state open --limit 100`, oldest first.
            - For each PR: inspect `gh pr view <n>`, `gh pr diff <n>`, `gh pr checks <n>`.
              MERGE (squash, `--delete-branch`) only if required checks pass (or none required
              and the diff is plainly safe), it's single-purpose and sound, and it does NOT
              hit the HARD FLOOR. Otherwise leave it open with a one-line blocking comment.
            - Close clear duplicates (same scope as another open/merged PR) with a comment
              naming the winner. Never close something with unique scope.

            HARD FLOOR — NEVER merge a PR that:
              - deletes user/account data or rows
              - runs destructive DB migrations (DROP / TRUNCATE / irreversible ALTER)
              - exposes, prints, or commits secrets, keys, or tokens
              - weakens auth, RLS, or billing without an explicit, reviewed reason
              - touches src/**/finance/**
            Flag those with a comment and leave them for Luis.

            SAFETY: never force-push; keep merges small and reversible; prefer holding over
            a risky merge. End with a one-paragraph summary: queued / merged / held / closed.
