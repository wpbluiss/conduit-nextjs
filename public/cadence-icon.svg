<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Cadence">
  <defs>
    <linearGradient id="ember" x1="0.05" y1="0.1" x2="0.95" y2="0.9">
      <stop offset="0" stop-color="#ffd0a8"/>
      <stop offset="0.35" stop-color="#ffa876"/>
      <stop offset="0.7" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#d9532a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.34" r="0.72">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#ff7a2e" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.78">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="tipHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9b8" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#ff8a3d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base + depth -->
  <rect width="512" height="512" rx="116" fill="#0a0807"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- faint baseline track to ground the rhythm -->
  <path d="M64 256 H448" fill="none" stroke="#ff8a3d" stroke-opacity="0.10" stroke-width="3" stroke-linecap="round"/>

  <!-- echo pulse behind, for depth -->
  <path d="M70 262 L150 262 L176 244 L204 168 L258 356 L302 214 L330 262 L440 262"
        fill="none" stroke="#ff8a3d" stroke-opacity="0.16" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round" transform="translate(6 10)"/>

  <!-- soft glow layers under the main pulse (filter-free, rasterizes everywhere) -->
  <g fill="none" stroke="#ff8a3d" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 256 L148 256 L174 236 L202 152 L256 360 L300 210 L330 256 L442 256" stroke-opacity="0.07" stroke-width="52"/>
    <path d="M70 256 L148 256 L174 236 L202 152 L256 360 L300 210 L330 256 L442 256" stroke-opacity="0.10" stroke-width="38"/>
  </g>

  <!-- main pulse -->
  <path d="M70 256 L148 256 L174 236 L202 152 L256 360 L300 210 L330 256 L442 256"
        fill="none" stroke="url(#ember)" stroke-width="25"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- luminous leading tip -->
  <circle cx="442" cy="256" r="40" fill="url(#tipHalo)"/>
  <circle cx="442" cy="256" r="15" fill="#fff1e2"/>
  <circle cx="442" cy="256" r="15" fill="url(#ember)" fill-opacity="0.35"/>

  <!-- glass sheen + corner vignette -->
  <rect x="14" y="14" width="484" height="484" rx="104" fill="url(#sheen)"/>
  <rect width="512" height="512" rx="116" fill="url(#vignette)"/>
</svg>
