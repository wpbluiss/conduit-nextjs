<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Praxis">
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa876"/>
      <stop offset="0.55" stop-color="#D67817"/>
      <stop offset="1" stop-color="#a85a10"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8AFFB"/>
      <stop offset="1" stop-color="#5B63E8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#D67817" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#D67817" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0a0908"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- Connecting spokes from central hub to outer nodes -->
  <line x1="256" y1="256" x2="256" y2="148" stroke="#A8AFFB" stroke-width="14" stroke-linecap="round" opacity="0.45"/>
  <line x1="256" y1="256" x2="162" y2="310" stroke="#A8AFFB" stroke-width="14" stroke-linecap="round" opacity="0.45"/>
  <line x1="256" y1="256" x2="350" y2="310" stroke="#A8AFFB" stroke-width="14" stroke-linecap="round" opacity="0.45"/>
  <!-- Outer employee nodes -->
  <circle cx="256" cy="148" r="24" fill="url(#indigo)"/>
  <circle cx="162" cy="310" r="24" fill="url(#indigo)"/>
  <circle cx="350" cy="310" r="24" fill="url(#indigo)"/>
  <!-- Central Praxis hub — ember -->
  <circle cx="256" cy="256" r="38" fill="url(#ember)"/>
</svg>
